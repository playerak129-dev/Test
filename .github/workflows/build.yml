name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RIZZ-APP APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
            echo "::error::Android SDK command-line tools introuvables."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager introuvable."
            exit 1
          fi

          echo "SDK Manager détecté : $SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install
          elif [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install --legacy-peer-deps
          else
            echo "::error::Aucun package.json trouvé à la racine."
            exit 1
          fi

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun run build
          else
            npm run build
          fi

          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html introuvable après le build."
            exit 1
          fi

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ]; then
            if [ ! -f capacitor.config.ts ] \
              && [ ! -f capacitor.config.json ] \
              && [ ! -f capacitor.config.js ]; then
              echo "::error::Projet Android absent et configuration Capacitor introuvable."
              exit 1
            fi

            npx cap add android
          fi

          npx cap sync android

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK introuvable : $APK"
            find android -type f -name "*.apk" || true
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/RIZZ-APP-debug.apk

          ls -lh release/RIZZ-APP-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RIZZ-APP-debug-apk
          path: release/RIZZ-APP-debug.apk
          if-no-files-found: error
          retention-days: 7